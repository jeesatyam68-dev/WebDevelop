<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
  background-color: #0b0c10;
  color: #fff;
  font-family: sans-serif;
  transition: background-color 0.4s ease;
}

/* Tubelight Container & Bulb */
.tubelight {
  width: 260px;
  height: 8px;
  background-color: #333;
  border-radius: 4px;
  margin: 20px auto;
  transition: all 0.3s ease;
}

/* Tubelight ON State with Neon Glow & Flicker */
.tubelight.is-on {
  background-color: #e0f7fa;
  box-shadow: 0 0 10px #00e5ff, 
              0 0 25px #00e5ff, 
              0 0 50px #00e5ff, 
              0 15px 80px rgba(0, 229, 255, 0.6);
  animation: flicker 0.35s ease-in-out;
}

/* Flicker Animation for Real Tube Effect */
@keyframes flicker {
  0% { opacity: 0.2; }
  20% { opacity: 1; }
  40% { opacity: 0.3; }
  60% { opacity: 0.9; }
  80% { opacity: 0.4; }
  100% { opacity: 1; }
}

/* Switch Button */
.switch-btn {
  padding: 8px 18px;
  cursor: pointer;
  background: #1f2833;
  color: #66fcf1;
  border: 1px solid #66fcf1;
  border-radius: 6px;
  font-weight: bold;
}

/* Portfolio Content Visibility */
.hidden-content {
  opacity: 0.05;
  filter: blur(4px);
  transition: opacity 0.6s ease, filter 0.6s ease;
  text-align: center;
  margin-top: 50px;
}

.hidden-content.visible {
  opacity: 1;
  filter: blur(0);
}
    </style>
</head>
<body>
    
<header class="navbar">
  <div class="light-container">
    <div class="tubelight" id="tube"></div>
  </div>
  <button id="lightSwitch" class="switch-btn">Power ON</button>
</header>

<main id="portfolioContent" class="hidden-content">
  <h1>Hi, I'm a Developer 👋</h1>
  <p>Welcome to my portfolio! Here are my projects and skills...</p>
</main>

    <script src="java.js"></script>
</body>
</html>
